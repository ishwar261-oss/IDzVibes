[workspace]
members = [
    "crates/idz-shared",
    "crates/idz-audio",
    "crates/idz-input",
    "apps/desktop",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["IDzVibes Contributors"]
license = "MIT"
repository = "https://github.com/ishwar261-oss/IDzVibes"
description = "Ultra-low-latency keyboard sound engine"

[workspace.dependencies]
# Shared across crates
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
crossbeam-channel = "0.5"
rand = "0.8"

# Audio
cpal = "0.15"
symphonia = { version = "0.5", features = ["wav", "mp3", "ogg", "flac", "pcm", "vorbis"] }

# Windows
[workspace.dependencies.windows]
version = "0.58"
features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_System_Console",
    "Win32_Media_Audio",
    "Win32_Devices_HumanInterfaceDevice",
]

[profile.release]
opt-level = 3
codegen-units = 1
lto = false
